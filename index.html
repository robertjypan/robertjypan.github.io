.hero-veil{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(13,12,10,.12) 0%, rgba(13,12,10,.02) 45%, rgba(13,12,10,.34) 100%);
}
.hero-content{ position:relative; padding:24px; max-width:900px; }
.hero h1{
  font-weight:500;
  font-size:clamp(3rem, 9vw, 6.4rem);
  line-height:1.04;
  letter-spacing:.01em;
  color:var(--hero-ink);
}
.hero h1 em{ font-style:italic; font-weight:400; }
.hero .sub{
  margin-top:26px;
  font-family:"Noto Serif TC","Songti TC",serif;
  font-size:clamp(.95rem, 2vw, 1.1rem);
  letter-spacing:.32em; text-indent:.32em;
  color:rgba(247,241,226,.86);
}
.pill{
  display:inline-block; margin-top:44px;
  padding:13px 34px;
  border-radius:999px;
  background:var(--paper); color:var(--ink);
  font-family:"Noto Serif TC",serif;
  font-size:.92rem; letter-spacing:.18em; text-indent:.18em;
  text-decoration:none;
  box-shadow:0 8px 28px rgba(0,0,0,.25);
  transition:transform .25s ease, box-shadow .25s ease;
}
.pill:hover{ transform:translateY(-2px); box-shadow:0 12px 32px rgba(0,0,0,.3); }

/* ── 下半部：左黑右米 ─────────────────────────── */
.split{ display:grid; grid-template-columns: 1fr 1.12fr; }

.about{
  background:var(--ink); color:var(--cream);
  padding:clamp(44px,6vw,84px) clamp(28px,5vw,72px);
}
.eyebrow{
  font-size:.78rem; letter-spacing:.34em; text-indent:.34em;
  color:var(--muted-d);
  font-family:"Noto Serif TC",serif;
}
.about h2{
  margin-top:18px;
  font-weight:500;
  font-size:clamp(2rem, 3.6vw, 2.9rem);
  line-height:1.15;
}
.about h2 em{ font-style:italic; font-weight:400; }
.about p{
  margin-top:20px; max-width:44ch;
  font-family:"Noto Serif TC",serif;
  font-size:1.02rem; line-height:2;
  color:rgba(243,238,225,.82);
}
.about figure{ margin-top:36px; max-width:400px; }
.about figure img{
  width:100%; border-radius:3px;
  box-shadow:0 16px 44px rgba(0,0,0,.5);
}
.about figcaption{
  margin-top:14px;
  font-style:italic; font-size:.95rem;
  color:var(--muted-d); letter-spacing:.06em;
}

/* ── 旅程紀錄 ─────────────────────────────────── */
.journal{
  background:var(--panel);
  padding:clamp(44px,6vw,84px) clamp(28px,5vw,72px);
}
.journal h2{
  font-weight:500;
  font-size:clamp(2rem, 3.6vw, 2.9rem);
}
.journal h2 em{ font-style:italic; font-weight:400; }
.journal .zh-label{
  margin-top:10px;
  font-family:"Noto Serif TC",serif;
  font-size:.85rem; letter-spacing:.5em;
  color:var(--muted);
}
.journal .gate-hint{
  margin-top:22px;
  font-family:"Noto Serif TC",serif;
  font-size:.9rem; color:var(--muted); line-height:1.9;
}
.cards{ margin-top:38px; display:flex; flex-direction:column; gap:34px; }

.card{
  display:flex; align-items:center; gap:24px;
  width:100%; text-align:left;
  background:none; border:0; cursor:pointer;
  font:inherit; color:inherit;
  padding:0;
}
.card .thumb{
  flex:0 0 190px; height:132px;
  border-radius:3px; overflow:hidden; position:relative;
  box-shadow:0 10px 26px rgba(13,12,10,.18);
  transition:transform .3s ease, box-shadow .3s ease;
}
.card .thumb img{ width:100%; height:100%; object-fit:cover; }
.card:hover .thumb{ transform:translateY(-3px); box-shadow:0 16px 32px rgba(13,12,10,.24); }
.card .meta{ flex:1; min-width:0; }
.card .meta h3{
  font-weight:600; font-size:1.5rem; line-height:1.3;
  font-family:"Noto Serif TC","Cormorant Garamond",serif;
}
.card .meta .sub{
  margin-top:6px;
  font-family:"Noto Serif TC",serif;
  font-size:.9rem; color:var(--muted); letter-spacing:.08em;
}
.card .go{
  margin-top:10px; display:inline-flex; align-items:center; gap:8px;
  font-style:italic; font-size:.98rem; color:var(--muted);
  transition:color .25s ease;
}
.card .go svg{ width:13px; height:13px; opacity:.75; }
.card:hover .go{ color:var(--clay); }
.card .arrow{
  display:inline-block; transition:transform .25s ease;
}
.card:hover .arrow{ transform:translateX(4px); }
.card:focus-visible{ outline:2px solid var(--clay); outline-offset:6px; border-radius:2px; }

/* 名古屋佔位縮圖（之後換成 <img> 即可） */
.ph-nagoya{
  background:linear-gradient(165deg,#2E3350 0%, #55496B 46%, #B0715C 82%, #D9A177 100%);
  display:flex; align-items:center; justify-content:center; gap:14px;
}
.ph-nagoya svg{ width:72px; height:auto; opacity:.95; }
.ph-nagoya span{
  writing-mode:vertical-rl;
  font-family:"Noto Serif TC",serif;
  color:#F4EDDD; font-size:1.02rem; letter-spacing:.34em;
}

/* ── 密碼小門 ─────────────────────────────────── */
.gate{
  position:fixed; inset:0; z-index:60;
  display:none; align-items:center; justify-content:center;
  padding:24px;
  background:rgba(13,12,10,.55);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.gate.open{ display:flex; }
.gate-card{
  width:min(400px, 100%);
  background:var(--paper);
  border-radius:6px;
  padding:38px 34px 32px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
  animation:rise .3s ease;
}
@keyframes rise{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
.gate-card .key-ico{ width:26px; height:26px; margin:0 auto 14px; opacity:.7; }
.gate-card h3{
  font-weight:500; font-size:1.7rem; letter-spacing:.04em;
}
.gate-card .gate-text{
  margin-top:12px;
  font-family:"Noto Serif TC",serif;
  font-size:.92rem; line-height:1.9; color:var(--muted);
}
.gate-card input{
  margin-top:22px;
  width:100%; padding:12px 16px;
  font-family:"Noto Serif TC",serif;
  font-size:1.05rem; text-align:center; letter-spacing:.4em; text-indent:.4em;
  border:1px solid var(--line); border-radius:4px;
  background:#fff; color:var(--ink);
}
.gate-card input:focus{ outline:2px solid var(--clay); outline-offset:1px; }
.gate-err{
  margin-top:12px; min-height:1.3em;
  font-family:"Noto Serif TC",serif;
  font-size:.85rem; color:#9C3D2E;
}
.gate-actions{ margin-top:16px; display:flex; gap:12px; justify-content:center; }
.btn{
  padding:11px 30px; border-radius:999px; cursor:pointer;
  font-family:"Noto Serif TC",serif; font-size:.9rem; letter-spacing:.14em; text-indent:.14em;
  border:1px solid transparent;
  transition:transform .2s ease, opacity .2s ease;
}
.btn:hover{ transform:translateY(-1px); }
.btn:focus-visible{ outline:2px solid var(--clay); outline-offset:2px; }
.btn-dark{ background:var(--ink); color:var(--cream); }
.btn-ghost{ background:none; border-color:var(--line); color:var(--muted); }
.gate-card.shake{ animation:shake .4s ease; }
@keyframes shake{
  10%,90%{ transform:translateX(-2px);} 20%,80%{ transform:translateX(4px);}
  30%,50%,70%{ transform:translateX(-6px);} 40%,60%{ transform:translateX(6px);}
}
.gate-notice{
  display:none;
  margin-top:18px;
  font-family:"Noto Serif TC",serif;
  font-size:.92rem; line-height:2; color:var(--ink);
  background:var(--panel); border-radius:4px; padding:16px 18px;
  text-align:left;
}

/* ── Footer ───────────────────────────────────── */
footer{
  background:var(--cream);
  text-align:center;
  padding:34px 20px;
  font-style:italic; font-size:.95rem; color:var(--muted);
  letter-spacing:.08em;
}

/* ── RWD ──────────────────────────────────────── */
@media (max-width: 880px){
  .split{ grid-template-columns:1fr; }
  .about figure{ max-width:340px; }
  .card .thumb{ flex-basis:150px; height:106px; }
}
@media (max-width: 480px){
  .card{ align-items:flex-start; }
  .card .thumb{ flex-basis:126px; height:96px; }
  .card .meta h3{ font-size:1.28rem; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
  html{ scroll-behavior:auto; }
}
</style>

<!-- ════════ 密碼小門 ════════ -->
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-card" id="gateCard">
    <svg class="key-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="8" cy="15" r="4"/><path d="M11 12 21 2m-4 1 3 3m-6 0 3 3"/>
    </svg>
    <h3 id="gateTitle">私人紀錄</h3>
    <p class="gate-text">這一頁只留給家人與好朋友，<br>請輸入密碼繼續。</p>
    <input id="gateInput" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼" aria-label="密碼">
    <p class="gate-err" id="gateErr"></p>
    <div class="gate-notice" id="gateNotice">
      ✓ 密碼正確。這個旅程的連結還沒設定——<br>
      請打開這個檔案，在最上方的 <strong>TRIPS</strong> 區塊填入網址。
    </div>
    <div class="gate-actions">
      <button class="btn btn-dark" id="gateGo">進入</button>
      <button class="btn btn-ghost" id="gateCancel">取消</button>
    </div>
  </div>
</div>

<script>
/* ── 小工具 ── */
function normalizeInput(s){
  return s.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).trim();
}
function djb2(str){
  let h = 5381;
  for (let i = 0; i < str.length; i++){ h = (((h << 5) + h) + str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}
/* 更換密碼用：Console 執行 hashOf("新密碼") → 貼到 PASS_KEY */
window.hashOf = s => djb2(normalizeInput(s));

/* ── 卡片文字由 TRIPS 帶入 ── */
document.querySelectorAll(".card").forEach(card => {
  const t = TRIPS[card.dataset.trip];
  if (!t) return;
  card.querySelector(".meta h3").textContent = t.title;
  card.querySelector(".meta .sub").textContent = t.sub;
});

/* ── 密碼閘門邏輯 ── */
const gate    = document.getElementById("gate");
const gCard   = document.getElementById("gateCard");
const gInput  = document.getElementById("gateInput");
const gErr    = document.getElementById("gateErr");
const gNotice = document.getElementById("gateNotice");
const gGo     = document.getElementById("gateGo");
const gCancel = document.getElementById("gateCancel");

let unlocked = false;      /* 本次瀏覽已解鎖（不寫入任何儲存空間） */
let currentTrip = null;

function openGate(trip){
  currentTrip = trip;
  gErr.textContent = "";
  gNotice.style.display = "none";
  gInput.value = "";
  gInput.style.display = "";
  gGo.style.display = "";
  gate.classList.add("open");
  setTimeout(() => gInput.focus(), 60);
}
function closeGate(){ gate.classList.remove("open"); }

function showNotice(){
  gInput.style.display = "none";
  gGo.style.display = "none";
  gErr.textContent = "";
  gNotice.style.display = "block";
  gate.classList.add("open");
}

function enterTrip(trip){
  const t = TRIPS[trip];
  if (t && t.url){ closeGate(); location.href = t.url; }
  else { showNotice(); }
}

function tryUnlock(){
  const v = normalizeInput(gInput.value);
  if (djb2(v) === PASS_KEY){
    unlocked = true;
    enterTrip(currentTrip);
  } else {
    gErr.textContent = "密碼不對，再試一次";
    gCard.classList.remove("shake");
    void gCard.offsetWidth;
    gCard.classList.add("shake");
    gInput.select();
  }
}

document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => {
    const trip = card.dataset.trip;
    if (unlocked){ currentTrip = trip; enterTrip(trip); }
    else openGate(trip);
  });
});

gGo.addEventListener("click", tryUnlock);
gInput.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
gCancel.addEventListener("click", closeGate);
gate.addEventListener("click", e => { if (e.target === gate) closeGate(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeGate(); });
</script>
